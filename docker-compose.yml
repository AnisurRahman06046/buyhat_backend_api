services:
  postgres:
    image: postgres:16-alpine
    container_name: buyhat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-buyhat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buyhat_password}
      POSTGRES_DB: ${DB_NAME:-buyhat}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates one Postgres schema per module on first boot (idempotent).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-buyhat} -d ${DB_NAME:-buyhat}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buyhat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: buyhat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runner
    container_name: buyhat-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (override .env localhost values).
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
